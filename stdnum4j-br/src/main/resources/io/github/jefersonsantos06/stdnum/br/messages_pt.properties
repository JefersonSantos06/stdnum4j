# Tradução das mensagens deste pacote. A chave é o code passado a
# Message.of; o inglês fica no próprio código Java, nunca aqui.
brcode.crc.mismatch         = O CRC do payload não confere.
brcode.crc.short            = O payload é curto demais para conter o CRC.
brcode.crc.tag              = Um payload Pix termina com a tag 63, comprimento 04 e o CRC.
brcode.tlv.malformed        = Campo TLV malformado no payload.
brcode.tlv.overrun          = Um campo TLV ultrapassa o fim do payload.
brcode.tlv.trailing         = Há bytes sobrando depois do último campo TLV.
chave-nfe.month             = O mês de emissão deve estar entre 01 e 12.
chave-nfe.uf                = Código de UF do IBGE desconhecido.
cnpj.repeated               = Um CNPJ formado por um único caractere repetido não é válido.
cns.prefix                  = Um CNS começa com 1 ou 2 (definitivo), ou com 7, 8 ou 9 (provisório).
codigo-barras.currency      = O código de moeda do código de barras de boleto é 9 (real).
cpf.repeated                = Um CPF formado por um único dígito repetido não é válido.
linha-digitavel.field-check = O dígito verificador de um campo da linha digitável é inválido.
pis-pasep.repeated          = Um PIS/PASEP formado por um único dígito repetido não é válido.
renavam.repeated            = Um RENAVAM formado por um único dígito repetido não é válido.
titulo-eleitor.uf           = O código de UF do TSE deve estar entre 01 e 28.
