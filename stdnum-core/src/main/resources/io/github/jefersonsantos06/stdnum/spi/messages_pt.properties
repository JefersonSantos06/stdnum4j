# A rede de segurança: uma destas quatro frases responde por qualquer número
# inválido, de qualquer tipo, sempre que não houver tradução mais específica.
# Por isso ela não pode nomear o número — precisa ser verdadeira tanto para uma
# "Chave NF-e" quanto para um "Código de barras".
#
# Se um valor daqui usar {0}, ele recebe os argumentos da mensagem específica
# que caiu até aqui, que variam de um número para outro. Na prática: não use.
error.INVALID_FORMAT    = O número tem um formato inválido.
error.INVALID_LENGTH    = O número tem um comprimento inválido.
error.INVALID_CHECKSUM  = A soma de verificação ou o dígito verificador do número é inválido.
error.INVALID_COMPONENT = Uma das partes do número é inválida ou desconhecida.
